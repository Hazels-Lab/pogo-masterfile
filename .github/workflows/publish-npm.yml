name: Publish npm

on:
  push:
    tags:
      - "typescript-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. typescript-v0.1.3)"
        required: true
        type: string

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Trusted Publishing requires npm >= 11.5.1. Node 24 bundles npm 11.16+,
      # so it is already satisfied — do NOT add a `npm install -g npm@latest`
      # step here. That is what broke this workflow for three weeks: npm 12
      # requires Node >= 22.22.2, so installing it on top of a pinned Node 20
      # failed EBADENGINE before `npm publish` ever ran. Bump this pin instead.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      # packages/ts ships its committed dist/ verbatim — no build step.
      # `bun run check` verifies the dist/ matches its source via tsconfig.build.
      - name: Verify
        run: bun run check
        working-directory: packages/ts
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/ts
